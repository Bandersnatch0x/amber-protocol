name: Governance loop e2e

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"

permissions:
  contents: read

jobs:
  governance-loop:
    name: Fresh-target governance loop
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20.x

      - name: Install dependencies
        run: npm ci

      - name: Run governance-loop e2e
        run: npm run test:governance-loop
