name: Publish to GitHub Packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: # manual trigger for testing

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish @bandersnatch0x/amber-protocol
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.x

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Validate package contents
        run: npm pack --dry-run

      # GitHub Packages requires scoped package names.
      # Temporarily scope the name for publication — the source stays unscoped.
      - name: Scope package for GitHub Packages
        run: npm pkg set name="@bandersnatch0x/amber-protocol"



      # Write GitHub Packages auth to .npmrc. NODE_AUTH_TOKEN from setup-node
      # only covers registry.npmjs.org; GitHub Packages needs its own entry.

      - name: Authenticate with GitHub Packages
        run: |
          echo "@bandersnatch0x:registry=https://npm.pkg.github.com" >> .npmrc
          echo "//npm.pkg.github.com/:_authToken=${NPM_GH_TOKEN}" >> .npmrc
        env:
          NPM_GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Idempotent publish: a re-pointed tag or a re-run must not fail the
      # workflow with E409 "Cannot publish over existing version". If this
      # version is already on GitHub Packages, skip. All other failures (auth,
      # network, package shape) still surface as real errors.
      - name: Publish to GitHub Packages
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@bandersnatch0x/amber-protocol@$VERSION" --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "::notice::@bandersnatch0x/amber-protocol@$VERSION already published — skipping."
          else
            npm publish --registry=https://npm.pkg.github.com
          fi

      # Restore the unscoped name after publishing so the working tree is clean.
      - name: Restore package name
        run: npm pkg set name="amber-protocol"
