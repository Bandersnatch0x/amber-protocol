name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main
      - "codex/**"
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 18.x
          - 20.x
          - 22.x

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Validate manifests
        run: npm run manifests

      - name: Run repository doctor
        run: npm run doctor

      - name: Check generated agents are up to date
        run: npm run gen:agents:check

      - name: Smoke-check CLI help
        run: node scripts/amber.js --help

  web:
    name: Web viewer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20.x

      - name: Install web dependencies
        working-directory: apps/web
        run: npm install --legacy-peer-deps

      - name: Build web app
        working-directory: apps/web
        run: npm run build

      - name: Run web unit tests
        working-directory: apps/web
        run: npm run test

      - name: Install Playwright dependencies
        working-directory: apps/web
        run: npx playwright install --with-deps

      - name: Run web E2E tests
        working-directory: apps/web
        run: npm run test:e2e

  release-dry-run:
    name: Release dry-run
    runs-on: ubuntu-latest
    needs:
      - test
      - web
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.x

      - name: Install dependencies
        run: npm install

      - name: Validate package contents
        run: npm pack --dry-run --json > npm-pack-dry-run.json

      - name: Upload package dry-run summary
        uses: actions/upload-artifact@v7
        with:
          name: npm-pack-dry-run
          path: npm-pack-dry-run.json
          archive: false
