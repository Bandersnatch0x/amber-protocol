name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main
      - "codex/**"
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  identity:
    name: Commit identity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout commit history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20.x

      - name: Validate introduced commit identities
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          zero_sha="0000000000000000000000000000000000000000"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            node scripts/validate-git-identity.js --range "$BASE_SHA..$HEAD_SHA"
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "$zero_sha" ]; then
            node scripts/validate-git-identity.js --range "$BEFORE_SHA..$HEAD_SHA"
          elif [ "$REF_TYPE" = "branch" ]; then
            merge_base="$(git merge-base "origin/$DEFAULT_BRANCH" "$HEAD_SHA")"
            node scripts/validate-git-identity.js --range "$merge_base..$HEAD_SHA"
          else
            node scripts/validate-git-identity.js --commit "$HEAD_SHA"
          fi

  test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    needs: identity

    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 18.x
          - 20.x
          - 22.x

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Validate manifests
        run: npm run manifests

      - name: Run repository doctor
        run: npm run doctor

      - name: Amber drift gate (dogfood, non-blocking)
        run: node scripts/amber.js drift --target . --format gh-annotations --no-fail
        continue-on-error: true

      - name: Check generated agents are up to date
        run: npm run gen:agents:check

      - name: Smoke-check CLI help
        run: node scripts/amber.js --help

  coverage:
    name: Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20.x

      - name: Install dependencies
        run: npm install

      - name: Run coverage
        run: npm run test:coverage

      - name: Check coverage thresholds
        run: |
          if [ ! -f coverage/coverage-summary.json ]; then
            echo "Coverage summary not found"
            exit 1
          fi
          echo "Coverage thresholds met"

  security:
    name: Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20.x
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm install

      - name: Run security audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Check production dependencies for known vulnerabilities
        run: |
          echo "Security scan completed"
          # Release gate covers dependencies shipped to users. The full dependency
          # tree is still scanned above so development-tool advisories stay visible.
          npm audit --omit=dev --audit-level=high

  performance:
    name: Performance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20.x

      - name: Install dependencies
        run: npm install

      - name: Run load tests
        run: npm run test:load

  web:
    name: Web viewer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20.x

      - name: Install root dependencies
        # The web server routers require() CLI core modules (scripts/lib/*) via
        # createRequire, which pull in root deps (ajv). Web unit tests and the
        # e2e server both load that path, so root node_modules must be present.
        run: npm install

      - name: Install web dependencies
        working-directory: apps/web
        run: npm install --legacy-peer-deps

      - name: Build web app
        working-directory: apps/web
        run: npm run build

      - name: Run web unit tests
        working-directory: apps/web
        run: npm run test

      - name: Install Playwright dependencies
        working-directory: apps/web
        run: npx playwright install --with-deps

      - name: Run web E2E tests
        working-directory: apps/web
        run: npm run test:e2e

  release-dry-run:
    name: Release dry-run
    runs-on: ubuntu-latest
    needs:
      - identity
      - test
      - coverage
      - security
      - performance
      - web
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x

      - name: Install dependencies
        run: npm install

      - name: Validate package contents
        run: npm pack --dry-run --json > npm-pack-dry-run.json

      - name: Upload package dry-run summary
        uses: actions/upload-artifact@v7
        with:
          name: npm-pack-dry-run
          path: npm-pack-dry-run.json
          archive: false

  release:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs:
      - identity
      - test
      - coverage
      - security
      - performance
      - web
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-rc') && !contains(github.ref, '-beta')

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm install

      - name: Validate package contents
        run: |
          npm pack
          tar -tzf *.tgz > package-manifest.txt

          echo "Checking package manifest..."

          # Check that critical files are included
          grep -q 'package/scripts/amber.js' package-manifest.txt || { echo "ERROR: amber.js not found"; exit 1; }
          grep -q 'package/templates/' package-manifest.txt || { echo "ERROR: templates/ not found"; exit 1; }
          grep -q 'package/routes/' package-manifest.txt || { echo "ERROR: routes/ not found"; exit 1; }
          grep -q 'package/schemas/' package-manifest.txt || { echo "ERROR: schemas/ not found"; exit 1; }
          grep -q 'package/README.md' package-manifest.txt || { echo "ERROR: README.md not found"; exit 1; }
          grep -q 'package/LICENSE' package-manifest.txt || { echo "ERROR: LICENSE not found"; exit 1; }

          # Check that test files are NOT included
          if grep -q 'package/tests/' package-manifest.txt; then
            echo "ERROR: tests/ should not be included"
            exit 1
          fi

          # Check that .github is NOT included
          if grep -q 'package/.github/' package-manifest.txt; then
            echo "ERROR: .github/ should not be included"
            exit 1
          fi

          # Check that superpowers docs are NOT included
          if grep -q 'package/docs/superpowers/' package-manifest.txt; then
            echo "ERROR: docs/superpowers/ should not be included"
            exit 1
          fi

          echo "✅ Package contents validated"

      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref_name }}
          body: |
            See [CHANGELOG.md](https://github.com/Bandersnatch0x/amber-protocol/blob/master/CHANGELOG.md) for details.

            ## Installation

            ```bash
            npm install -g amber-protocol
            ```

            ## Documentation

            - [README](https://github.com/Bandersnatch0x/amber-protocol#readme)
            - [Getting Started](https://github.com/Bandersnatch0x/amber-protocol/blob/master/docs/guides/getting-started.md)
            - [Architecture](https://github.com/Bandersnatch0x/amber-protocol/tree/master/docs/architecture)
