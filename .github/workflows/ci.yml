name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main
      - "codex/**"
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  identity:
    name: Commit identity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout commit history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20.x

      - name: Validate introduced commit identities
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          zero_sha="0000000000000000000000000000000000000000"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            node scripts/validate-git-identity.js --range "$BASE_SHA..$HEAD_SHA"
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "$zero_sha" ]; then
            node scripts/validate-git-identity.js --range "$BEFORE_SHA..$HEAD_SHA"
          elif [ "$REF_TYPE" = "branch" ]; then
            merge_base="$(git merge-base "origin/$DEFAULT_BRANCH" "$HEAD_SHA")"
            node scripts/validate-git-identity.js --range "$merge_base..$HEAD_SHA"
          else
            node scripts/validate-git-identity.js --commit "$HEAD_SHA"
          fi

  test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    needs: identity

    strategy:
      fail-fast: false
      matrix:
        # eslint 10 / c8 12 require Node ^20.19 || ^22.12 || >=23 (no Node 18).
        node-version:
          - 20.x
          - 22.x

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Check format
        run: npm run format:check

      - name: Run tests
        run: npm test

      - name: Validate manifests
        run: npm run manifests

      - name: Run repository doctor
        run: npm run doctor

      - name: Amber drift gate (dogfood, non-blocking)
        run: node scripts/amber.js drift --target . --format gh-annotations --no-fail
        continue-on-error: true

      - name: Check generated agents are up to date
        run: npm run gen:agents:check

      - name: Smoke-check CLI help
        run: node scripts/amber.js --help

  coverage:
    name: Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20.x

      - name: Install dependencies
        run: npm ci

      - name: Run coverage
        run: npm run test:coverage

      - name: Check coverage thresholds
        run: |
          if [ ! -f coverage/coverage-summary.json ]; then
            echo "Coverage summary not found"
            exit 1
          fi
          echo "Coverage thresholds met"

  security:
    name: Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20.x
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

      # apps/web is not part of the root workspace, so the audit above never
      # reaches it. Scan its lockfile explicitly (no install needed).
      - name: Run web viewer security audit
        run: npm audit --prefix apps/web --package-lock-only --audit-level=moderate
        continue-on-error: true

      - name: Check production dependencies for known vulnerabilities
        run: |
          echo "Security scan completed"
          # Release gate covers dependencies shipped to users. The full dependency
          # tree is still scanned above so development-tool advisories stay visible.
          npm audit --omit=dev --audit-level=high
          npm audit --prefix apps/web --package-lock-only --omit=dev --audit-level=high

  performance:
    name: Performance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20.x

      - name: Install dependencies
        run: npm ci

      - name: Run load tests
        run: npm run test:load

  web:
    name: Web viewer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20.x

      - name: Install root dependencies
        # The web server routers require() CLI core modules (scripts/lib/*) via
        # createRequire, which pull in root deps (ajv). Web unit tests and the
        # e2e server both load that path, so root node_modules must be present.
        run: npm ci

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci --legacy-peer-deps

      - name: Lint web app
        working-directory: apps/web
        run: npm run lint

      - name: Build web app
        working-directory: apps/web
        run: npm run build

      - name: Run web unit tests
        working-directory: apps/web
        run: npm run test

      - name: Install Playwright dependencies
        working-directory: apps/web
        run: npx playwright install --with-deps

      - name: Run web E2E tests
        working-directory: apps/web
        run: npm run test:e2e

  release-dry-run:
    name: Release dry-run
    runs-on: ubuntu-latest
    needs:
      - identity
      - test
      - coverage
      - security
      - performance
      - web
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x

      - name: Install dependencies
        run: npm ci

      - name: Validate package contents
        run: npm pack --dry-run --json > npm-pack-dry-run.json

      - name: Upload package dry-run summary
        uses: actions/upload-artifact@v7
        with:
          name: npm-pack-dry-run
          path: npm-pack-dry-run.json
          archive: false

  release:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs:
      - identity
      - test
      - coverage
      - security
      - performance
      - web
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-rc') && !contains(github.ref, '-beta')

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Validate package contents
        run: |
          npm pack
          tar -tzf *.tgz > package-manifest.txt

          echo "Checking package manifest..."

          # Check that critical files are included
          grep -q 'package/scripts/amber.js' package-manifest.txt || { echo "ERROR: amber.js not found"; exit 1; }
          grep -q 'package/templates/' package-manifest.txt || { echo "ERROR: templates/ not found"; exit 1; }
          grep -q 'package/routes/' package-manifest.txt || { echo "ERROR: routes/ not found"; exit 1; }
          grep -q 'package/schemas/' package-manifest.txt || { echo "ERROR: schemas/ not found"; exit 1; }
          grep -q 'package/README.md' package-manifest.txt || { echo "ERROR: README.md not found"; exit 1; }
          grep -q 'package/LICENSE' package-manifest.txt || { echo "ERROR: LICENSE not found"; exit 1; }

          # Check that test files are NOT included
          if grep -q 'package/tests/' package-manifest.txt; then
            echo "ERROR: tests/ should not be included"
            exit 1
          fi

          # Check that .github is NOT included
          if grep -q 'package/.github/' package-manifest.txt; then
            echo "ERROR: .github/ should not be included"
            exit 1
          fi

          # Check that superpowers docs are NOT included
          if grep -q 'package/docs/superpowers/' package-manifest.txt; then
            echo "ERROR: docs/superpowers/ should not be included"
            exit 1
          fi

          echo "✅ Package contents validated"

      - name: Validate lockstep versions
        run: node scripts/validate-release-versions.js

      - name: Publish to npm
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "amber-protocol@$VERSION" >/dev/null 2>&1; then
            echo "::notice::amber-protocol@$VERSION already published — skipping."
          else
            npm publish
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish DSH to npm
        working-directory: dsh
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "dsh-amber-protocol@$VERSION" >/dev/null 2>&1; then
            echo "::notice::dsh-amber-protocol@$VERSION already published — skipping."
          else
            # Confirm the dependency is resolvable on npmjs before publishing DSH;
            # registry propagation after the amber-protocol publish can lag.
            visible=false
            for attempt in $(seq 1 30); do
              if npm view "amber-protocol@$VERSION" >/dev/null 2>&1; then
                visible=true
                break
              fi
              echo "amber-protocol@$VERSION not visible yet (attempt $attempt/30) — waiting 10s"
              sleep 10
            done
            if [ "$visible" != "true" ]; then
              echo "::error::amber-protocol@$VERSION is not visible on npmjs — refusing to publish dsh-amber-protocol@$VERSION with an unresolvable dependency."
              exit 1
            fi
            npm publish
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Check GitHub Release
        id: check_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          http_code=000
          for attempt in 1 2 3; do
            http_code=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/$TAG_NAME")
            case "$http_code" in
              200|404) break ;;
            esac
            echo "Release lookup returned HTTP $http_code (attempt $attempt/3) — retrying in 5s"
            sleep 5
          done
          case "$http_code" in
            200) echo "exists=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "exists=false" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::Cannot determine whether Release $TAG_NAME exists (last status $http_code) — failing instead of risking a duplicate release create."
              exit 1
              ;;
          esac

      - name: Create GitHub Release
        if: steps.check_release.outputs.exists == 'false'
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref_name }}
          body: |
            See [CHANGELOG.md](https://github.com/Bandersnatch0x/amber-protocol/blob/master/CHANGELOG.md) for details.

            ## Installation

            ```bash
            npm install -g amber-protocol
            ```

            ## Documentation

            - [README](https://github.com/Bandersnatch0x/amber-protocol#readme)
            - [Getting Started](https://github.com/Bandersnatch0x/amber-protocol/blob/master/docs/guides/getting-started.md)
            - [Architecture](https://github.com/Bandersnatch0x/amber-protocol/tree/master/docs/architecture)
