# Amber Protocol × dsh — Path B: Journey Skills
#
# Exposes Amber's 5 journey skills to the dsh agent by adding the
# amber-protocol skills directory as a custom skill root.
#
# Install: merge into $DSH_HOME/profiles/<name>/cordis.patch.yml
# Docs:    dsh/README.md
#
# The skill-filesystem plugin is already mounted by dsh-base; this patch
# overrides its config to include Amber's skills directory alongside the
# default roots, and enables it (web-app disables it by default).

- id: skill-filesystem
  disabled: false
  config:
    includeDefaultRoots: true
    customSkillDirs:
      # Adjust this path to your amber-protocol checkout
      - "/path/to/amber-protocol/skills"
